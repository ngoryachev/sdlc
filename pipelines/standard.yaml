name: standard
description: "clarify -> refine(HIL) -> plan -> approve_plan(HIL) -> implement -> self_check -> commit -> test(agent) -> PR -> review -> approve_result(HIL) -> publish -> qa(best effort). Any slice of it can be run as a task."
defaults:
  setting_sources: [project]
  effort: high

phases:
  - name: clarify
    type: claude
    prompt: prompts/clarify.md
    permission_mode: dontAsk
    allowed_tools: [Read, Glob, Grep, "Bash(git log*)", "Bash(git status*)", "Bash(ls*)", "Bash(rg *)", "Bash(cat *)"]
    disallowed_tools: [Write, Edit, NotebookEdit, Agent, WebSearch, WebFetch]
    output_schema: schemas/clarify.json
    max_turns: 15
    max_budget_usd: 0.5
    on_fail: { then: continue }      # clarify is optional: on failure the refine HIL shows the raw prompt

  - name: refine
    type: hil
    hil: refine_prompt

  - name: plan
    type: claude
    prompt: prompts/plan.md
    permission_mode: dontAsk
    allowed_tools: [Read, Glob, Grep, WebFetch, "Bash(git log*)", "Bash(git diff*)", "Bash(git status*)", "Bash(ls*)", "Bash(rg *)", "Bash(find *)", "Bash(cat *)"]
    disallowed_tools: [Edit, NotebookEdit, Agent]
    write_scope: [".sdlc/**"]
    artifacts: { plan_md: .sdlc/plan.md }
    max_turns: 40
    max_budget_usd: 2

  - name: approve_plan
    type: hil
    hil: approve_plan
    back_to: plan

  - name: implement
    type: claude
    prompt: prompts/implement.md
    session: fresh
    permission_mode: bypassPermissions
    disallowed_tools: ["Bash(git push*)", "Bash(git commit*)", "Bash(git checkout*)", "Bash(git reset*)", "Bash(sudo *)", WebSearch]
    max_turns: 80
    max_budget_usd: 8
    on_fail: { retry: 1, then: hil }

  - name: self_check
    type: claude
    when: "phases.implement.attempt == 1"   # polish the first implementation only; loop iterations are already verified by test/review
    prompt: prompts/self_check.md
    session: { resume: implement }
    permission_mode: bypassPermissions
    disallowed_tools: ["Bash(git push*)", "Bash(git commit*)", "Bash(git checkout*)", "Bash(git reset*)", "Bash(sudo *)", WebSearch]
    max_turns: 30
    max_budget_usd: 3
    on_fail: { then: continue }      # best effort: implement's own work stands if the check fails

  - name: commit_impl
    type: git
    git: commit
    message: "sdlc({{task.id}}): implement (attempt {{phases.implement.attempt}})"

  - name: test
    type: claude
    prompt: prompts/test.md
    session: fresh
    permission_mode: bypassPermissions
    disallowed_tools: ["Bash(git push*)", "Bash(git commit*)", "Bash(git checkout*)", "Bash(git reset*)", "Bash(sudo *)", WebSearch, WebFetch]
    output_schema: schemas/test.json
    fail_if: "structured.verdict == 'fail'"
    max_turns: 40
    max_budget_usd: 3
    on_fail:
      back_to: implement
      feedback: |
        The test phase found defects in your change. Fix the code (or the tests if they are genuinely wrong, and say so), then stop.

        {{phases.test.structured}}
      max_loops: 2
      then: hil

  - name: commit_tests
    type: git
    git: commit
    message: "sdlc({{task.id}}): tests"

  - name: pr
    type: git
    git: pr                          # opens the pull request before review; later loops only push to it
    pr:
      draft: false
      title: "{{task.title}}"
      body: prompts/pr_body.md

  - name: review
    type: claude
    prompt: prompts/review.md
    mode: "{{task.review_mode}}"
    session: fresh
    permission_mode: bypassPermissions
    disallowed_tools: [Write, Edit, NotebookEdit, Agent, WebSearch, WebFetch]
    output_schema: schemas/review.json
    fail_if: "structured.verdict == 'request_changes'"
    max_turns: 30
    max_budget_usd: 2
    on_fail:
      back_to: implement
      feedback: |
        A reviewer requested changes. Address every blocking and should_fix finding, keep changes minimal, then stop.

        {{phases.review.structured}}
      max_loops: 2
      then: fail                     # after max_loops proceed to approve_result; the human sees the review

  - name: approve_result
    type: hil
    hil: approve_result
    back_to: implement
    then_goto: review                # fixes picked by the human go straight back to review (commit and push on the way)

  - name: publish
    type: git
    git: review                      # posts the findings marked `post` at approve_result to the pull request

  - name: qa
    type: claude
    prompt: prompts/qa.md
    session: fresh
    permission_mode: bypassPermissions
    disallowed_tools: ["Bash(git push*)", "Bash(git commit*)", "Bash(git checkout*)", "Bash(git reset*)", "Bash(sudo *)", WebSearch, WebFetch]
    write_scope: [".sdlc/**"]
    output_schema: schemas/qa.json
    max_turns: 40
    max_budget_usd: 3
    on_fail: { then: continue }      # best effort: a failed QA phase never blocks the task

  - name: qa_report
    type: git
    git: comment
    when: phases.qa.structured
    body: prompts/qa_comment.md

  - name: qa_gate
    type: hil
    hil: approve_result
    when: "phases.qa.structured.verdict == 'issues'"
    back_to: implement
    then_goto: qa                    # after the fix: commit, push, then QA again; test and review are not repeated
